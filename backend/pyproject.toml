[project]
name = "summary-backend"
version = "0.1.0"
description = "FastAPI backend for the Summary Android recording summarizer MVP"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "boto3>=1.38.0",
    "celery[redis]>=5.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai>=1.92.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.9.0",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
